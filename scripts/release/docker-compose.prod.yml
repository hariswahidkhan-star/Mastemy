# Example production compose file that runs the released images from GHCR (attached to every GitHub release).
# Copy it next to a `.env` on the server (see docs/deployment-runbook.md for every setting), set MASTEMY_TAG to the
# release tag, then: `docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d`.
# Secrets live only in `.env` on the server; nothing secret belongs in this file.
#
# Images: ghcr.io/<owner>/<repo>/api and ghcr.io/<owner>/<repo>/web (MASTEMY_IMAGE_PREFIX=ghcr.io/<owner>/<repo>).
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mastemy
      MYSQL_USER: mastemy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost"], interval: 10s, retries: 10 }
  api:
    image: ${MASTEMY_IMAGE_PREFIX:?set MASTEMY_IMAGE_PREFIX in .env}/api:${MASTEMY_TAG:?set MASTEMY_TAG in .env}
    restart: unless-stopped
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Seo__PublicBaseUrl: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env}
      # Host header filtering: the public host plus the internal names used by the SSR server and health checks.
      AllowedHosts: "${PUBLIC_HOST:?set PUBLIC_HOST in .env};api;localhost"
      # nginx (web container) terminates TLS; trust its forwarded headers only from the compose network.
      Network__TrustedProxies__0: ${NETWORK_TRUSTED_PROXY_CIDR:-172.16.0.0/12}
      ConnectionStrings__Default: "Server=db;Port=3306;Database=mastemy;User=mastemy;Password=${MYSQL_PASSWORD};"
      # Applies pending EF Core migrations when the new API container starts (take a backup first: scripts/backup.sh).
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}
    depends_on: { db: { condition: service_healthy } }
    volumes: [appdata:/app/data]
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
  web:
    image: ${MASTEMY_IMAGE_PREFIX}/web:${MASTEMY_TAG}
    restart: unless-stopped
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      API_INTERNAL_URL: http://api:8080
    ports: ["8080:80"] # terminate TLS in a reverse proxy / load balancer in front of this port
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes: { dbdata: {}, appdata: {} }
