name: CI
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: mastemy, MYSQL_PASSWORD: mastemy_dev_pw, MYSQL_DATABASE: mastemy }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'mastemy'@'%'; FLUSH PRIVILEGES;"
      - run: dotnet build Mastemy.slnx -c Release
      - run: dotnet test Mastemy.slnx -c Release --no-build
        env: { MASTEMY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=mastemy;Password=mastemy_dev_pw;" }
  openapi:
    # docs/openapi.json must match what the API serves; regenerate with scripts/export-openapi.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - run: bash -n scripts/*.sh
      - run: scripts/export-openapi.sh --check
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  e2e:
    # Real browser against the real API + MySQL. Stripe calls go to e2e/fake-stripe.mjs and payment is
    # completed by a correctly signed webhook posted by the test; no YouTube or Stripe keys are used.
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: mastemy, MYSQL_PASSWORD: mastemy_dev_pw, MYSQL_DATABASE: mastemy }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      API_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "10.0.x" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'mastemy'@'%'; FLUSH PRIVILEGES;"
      - run: dotnet build src/Mastemy.Api -c Release
      - run: npm ci
        working-directory: src/web
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start fake Stripe, API and Vite
        run: |
          nohup node e2e/fake-stripe.mjs > fake-stripe.log 2>&1 &
          nohup e2e/start-api.sh > api.log 2>&1 &
          (cd src/web && nohup npx vite --port 5173 --strictPort > ../../vite.log 2>&1 &)
          for i in $(seq 1 90); do
            curl -sf http://localhost:5080/api/categories > /dev/null && curl -sf http://localhost:5173/ > /dev/null && exit 0
            sleep 2
          done
          echo "stack did not start"; tail -50 api.log vite.log; exit 1
      - run: npx playwright test
        working-directory: e2e
        env: { CI: "true" }
      - name: Backup/restore drill against the e2e database and resources
        run: scripts/restore-test.sh
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PASSWORD: mastemy_dev_pw
          MYSQL_DATABASE: mastemy_e2e
          RESOURCES_DIR: src/Mastemy.Api/data/resources # e2e/start-api.sh uses the default Resources:RootPath
      - if: failure()
        run: tail -200 api.log vite.log fake-stripe.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
