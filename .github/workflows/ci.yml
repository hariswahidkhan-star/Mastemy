name: CI
on:
  # Every pushed commit is verified (feature branches included), plus pull requests.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  api:
    name: API (dotnet test + MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: mastemy, MYSQL_PASSWORD: mastemy_dev_pw, MYSQL_DATABASE: mastemy }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'mastemy'@'%'; FLUSH PRIVILEGES;"
      - run: dotnet build Mastemy.slnx -c Release
      - run: dotnet test Mastemy.slnx -c Release --no-build
        env: { MASTEMY_TEST_MYSQL: "Server=127.0.0.1;Port=3306;User=mastemy;Password=mastemy_dev_pw;SslMode=Disabled;AllowPublicKeyRetrieval=true;" }

  openapi:
    name: OpenAPI drift
    # docs/openapi.json must match what the API serves; regenerate with scripts/export-openapi.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - run: bash -n scripts/*.sh
      - run: scripts/export-openapi.sh --check

  web:
    name: Web (lint, typecheck, unit tests, client + SSR build)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # `build` = tsc + client bundle (dist/) + SSR server bundle (dist-server/).
      - run: npm run build
      - name: SSR bundle present
        run: test -f dist-server/main.js && test -f dist/index.html

  e2e:
    name: E2E + accessibility (Playwright, full stack)
    # Real browser against the real API + MySQL with production-like security defaults (MFA for privileged roles,
    # refresh token only in the HttpOnly cookie). Stripe, Anthropic, OIDC and SMTP are local fakes (e2e/*.mjs);
    # no third-party keys are used. scripts/e2e-all.sh starts everything and runs every spec, a11y included.
    runs-on: ubuntu-latest
    needs: [api, web]
    timeout-minutes: 90
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: mastemy, MYSQL_PASSWORD: mastemy_dev_pw, MYSQL_DATABASE: mastemy }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      E2E_DB: mastemy_e2e
      E2E_LOG_DIR: ${{ github.workspace }}/e2e/stack-logs
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/web/package-lock.json
            e2e/package-lock.json
      - run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'mastemy'@'%'; FLUSH PRIVILEGES;"
      - run: npm ci
        working-directory: src/web
      - run: npm ci
        working-directory: e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Full stack + every spec (flows and a11y)
        run: scripts/e2e-all.sh
      - name: Backup/restore drill against the e2e database and resources
        run: scripts/restore-test.sh
        env:
          MYSQL_PASSWORD: mastemy_dev_pw
          MYSQL_DATABASE: mastemy_e2e
          RESOURCES_DIR: /tmp/mastemy-e2e-resources-mastemy_e2e
      - if: failure()
        run: tail -n 200 e2e/stack-logs/*.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/stack-logs
          retention-days: 7

  quality-gates:
    name: Bundle budgets + source hygiene (web)
    # Fails when the initial JS (entry + static imports, gzip) exceeds 150 kB, any lazy route exceeds 225 kB,
    # or the initial CSS exceeds 12 kB (src/web/scripts/check-budgets.mjs); when a component reads query data
    # without loading/error states (scripts/check-query-states.mjs); or when TODO/FIXME/lorem ipsum text is
    # left in the sources.
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: src/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run budgets -- dist --json bundle-budgets.json
      - run: node scripts/check-query-states.mjs
      - name: No TODO / FIXME / placeholder text in sources
        working-directory: .
        run: |
          if grep -rnIiE '\bTODO\b|\bFIXME\b|\bXXX:|lorem ipsum' src --include=*.ts --include=*.tsx --include=*.cs --include=*.css \
               --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj --exclude-dir=dist --exclude-dir=dist-server; then
            echo "::error::remove TODO/FIXME/placeholder text"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-budgets
          path: src/web/bundle-budgets.json
          retention-days: 14

  lighthouse:
    name: Lighthouse (mobile + desktop, >= 95 in every category)
    # Production SSR server + API on a fresh database seeded over the API (e2e/lighthouse/seed.mjs), then
    # Lighthouse 12 on the key public pages, median of 3 runs; fails below 95 in any category or when
    # LCP >= 2.5 s, CLS >= 0.1 or TBT >= 200 ms (scripts/lighthouse.sh -> e2e/lighthouse/run.mjs).
    runs-on: ubuntu-latest
    needs: [web]
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root, MYSQL_USER: mastemy, MYSQL_PASSWORD: mastemy_dev_pw, MYSQL_DATABASE: mastemy }
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      LH_RUNS: "3"
      LH_MIN: "95"
      LH_OUT: ${{ github.workspace }}/lighthouse-results
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json
      - run: mysql -h127.0.0.1 -uroot -proot -e "GRANT ALL ON *.* TO 'mastemy'@'%'; FLUSH PRIVILEGES;"
      - run: npm ci
        working-directory: src/web
      - name: Lighthouse against the SSR server
        run: CHROME_PATH=$(command -v google-chrome || command -v chromium) scripts/lighthouse.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: lighthouse-results
          retention-days: 14
