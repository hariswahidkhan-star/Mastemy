upstream mastemy_ssr { server 127.0.0.1:3000; keepalive 16; }

# Original scheme: the TLS-terminating proxy in front of this container sets X-Forwarded-Proto.
map $http_x_forwarded_proto $mastemy_proto { default $http_x_forwarded_proto; "" $scheme; }
# HSTS only when the request arrived over HTTPS (an empty value means the header is not sent).
map $mastemy_proto $mastemy_hsts { https "max-age=63072000; includeSubDomains; preload"; default ""; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m; # relay chunks are 8 MiB; nothing larger is accepted
  server_tokens off;

  # Text compression for files served directly (the SSR renderer compresses its own responses).
  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/css text/plain text/xml application/javascript text/javascript application/json
             application/manifest+json application/xml image/svg+xml font/ttf;

  # Security headers. HTML pages come from the SSR renderer, which sets the full set itself (including the
  # Content-Security-Policy with the hash of the inline theme script) and HSTS when X-Forwarded-Proto is
  # https; the API sets its own. The static locations below repeat them for directly served files
  # (add_header is not inherited into a location that declares its own).

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Correlation-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $mastemy_proto; proxy_request_buffering off; proxy_read_timeout 300s; }
  location /health { proxy_pass http://api:8080; }
  # Generated by the API from live catalogue data (Seo:PublicBaseUrl must be set on the api service).
  location = /robots.txt { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://api:8080; proxy_set_header Host $host; }

  # Hashed build assets: served directly, cached forever.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Cross-Origin-Resource-Policy same-origin always;
    add_header Strict-Transport-Security $mastemy_hsts always;
  }

  # Everything else: real files directly (favicon, share image, manifest), otherwise the Node SSR renderer
  # (public pages are server-rendered with metadata/JSON-LD; private routes get the noindex SPA shell).
  location / {
    try_files $uri @ssr;
    add_header Cache-Control "public, max-age=3600" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Share-card images and icons are fetched by other sites' link previews.
    add_header Cross-Origin-Resource-Policy cross-origin always;
    add_header Strict-Transport-Security $mastemy_hsts always;
  }
  location = / { proxy_pass http://mastemy_ssr; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $mastemy_proto; }
  location = /index.html { proxy_pass http://mastemy_ssr/; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header X-Forwarded-Proto $mastemy_proto; }
  location @ssr { proxy_pass http://mastemy_ssr; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $mastemy_proto; proxy_read_timeout 30s; }
}
