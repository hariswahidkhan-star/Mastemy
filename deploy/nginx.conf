upstream mastemy_ssr { server 127.0.0.1:3000; keepalive 16; }

server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 10m; # relay chunks are 8 MiB; nothing larger is accepted
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /api/ { proxy_pass http://api:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_request_buffering off; proxy_read_timeout 300s; }
  location /health { proxy_pass http://api:8080; }
  # Generated by the API from live catalogue data (Seo:PublicBaseUrl must be set on the api service).
  location = /robots.txt { proxy_pass http://api:8080; proxy_set_header Host $host; }
  location = /sitemap.xml { proxy_pass http://api:8080; proxy_set_header Host $host; }

  # Hashed build assets: served directly, cached forever.
  location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; add_header X-Content-Type-Options nosniff always; }

  # Everything else: real files directly, otherwise the Node SSR renderer (public pages are
  # server-rendered with metadata/JSON-LD; private routes get the noindex SPA shell).
  location / { try_files $uri @ssr; }
  location = / { proxy_pass http://mastemy_ssr; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; }
  location = /index.html { proxy_pass http://mastemy_ssr/; proxy_http_version 1.1; proxy_set_header Connection ""; }
  location @ssr { proxy_pass http://mastemy_ssr; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_read_timeout 30s; }
}
