<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Mastemy: free YouTube video courses with original study notes, MCQ practice and knowledge-assessment certificates." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1f3a8a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>Mastemy</title>
    <script>
      try {
        var t = localStorage.getItem('mastemy.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var q = new URLSearchParams(location.search).get('lang');
        var l = q === 'ar' || q === 'en' ? q : localStorage.getItem('mastemy.lang');
        if (l === 'ar' || l === 'en') { document.documentElement.lang = l; document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'; }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
